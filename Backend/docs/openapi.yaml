openapi: 3.0.3
info:
  title: AI Resume Analyzer & Mock Interview API
  version: 2.0.0
  description: |
    Upload a resume, get an AI analysis, practise a resume-based mock interview one question at a time,
    receive scored reports and track progress over time.

    ### Authentication
    `POST /login` sets two **HttpOnly cookies**: `accessToken` (15 min) and `refreshToken` (15 days).
    When the access token expires the API answers `401 Access token expired` - call `POST /refresh-token`
    and retry. Refresh tokens are **single-use** and rotate on every refresh.
    Scripts can send `Authorization: Bearer <accessToken>` instead of the cookie.

    ### Errors
    Every error has the same shape (`ErrorResponse`): `{ success: false, statusCode, message, errors[] }`.
    Validation errors list each problem in `errors` as `{ field, message }`.

    ### AI
    Slow AI calls (analysis, question generation, reports) run inside the request and can take 5-60 seconds.
    Without `OPENROUTER_API_KEY` (outside production) a built-in **mock AI** answers instantly, so every endpoint can be tried for free.
  license:
    name: MIT

servers:
  - url: http://localhost:5000/api/v1
    description: Local development

tags:
  - name: Auth
  - name: Account
  - name: Resume
  - name: Interview
  - name: Performance
  - name: System

paths:
  /health:
    get:
      tags: [System]
      summary: Health check
      description: Lives at the server root (`/health`), not under `/api/v1`. 200 when MongoDB is connected, 503 otherwise.
      servers:
        - url: http://localhost:5000
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: Database unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /signup:
    post:
      tags: [Auth]
      summary: Start signup (emails a 6-digit OTP)
      description: |
        Stores the pending signup (password hashed) for 10 minutes and emails a code.
        The account is created by `POST /verify-otp`.
        With `EXPOSE_OTP_IN_RESPONSE=true` (development only) the code is also returned as `devOtp`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignupRequest" }
      responses:
        "201":
          description: OTP sent
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          email: { type: string, format: email }
                          devOtp: { type: string, description: Development only, example: "482913" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /verify-otp:
    post:
      tags: [Auth]
      summary: Verify the email OTP and create the account
      description: 5 wrong guesses burn the code.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OtpRequest" }
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /resend-otp:
    post:
      tags: [Auth]
      summary: Send a fresh OTP for a signup that is waiting for verification
      description: One request per 60 seconds. No password needed - the hash stored at signup is reused.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "200":
          description: New OTP sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /login:
    post:
      tags: [Auth]
      summary: Sign in (sets cookies)
      description: |
        After 5 wrong passwords the account is locked for 15 minutes (`423`). Wrong email and wrong password give
        the same `400` answer. Account state (deactivated, unverified) is only revealed once the password is correct.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Signed in
          headers:
            Set-Cookie:
              description: accessToken and refreshToken (HttpOnly)
              schema: { type: string }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          id: { type: string }
                          email: { type: string, format: email }
                          username: { type: string }
        "400": { $ref: "#/components/responses/ValidationError" }
        "403":
          description: Account deactivated or email not verified
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "423":
          description: Account temporarily locked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /refresh-token:
    post:
      tags: [Auth]
      summary: Rotate the session
      description: Reads the `refreshToken` cookie, invalidates it and sets a new access + refresh pair.
      security:
        - refreshCookie: []
      responses:
        "200":
          description: Refreshed (new cookies set)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessResponse" }
        "401":
          description: Missing, invalid, expired or already-used refresh token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /logout:
    post:
      tags: [Auth]
      summary: Sign out this device
      description: Public on purpose, so it works even after the access token has expired.
      responses:
        "200":
          description: Signed out; cookies cleared
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessResponse" }

  /forgot-password:
    post:
      tags: [Auth]
      summary: Email a password-reset OTP
      description: Always answers the same way, whether or not the email is registered.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "200":
          description: Request accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /reset-password:
    post:
      tags: [Auth]
      summary: Choose a new password with the emailed OTP
      description: Signs the user out on every device.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResetPasswordRequest" }
      responses:
        "200":
          description: Password reset
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessResponse" }
        "400":
          description: Wrong or expired code, or validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /profile:
    get:
      tags: [Account]
      summary: Current user
      security: [{ accessCookie: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /update-profile:
    patch:
      tags: [Account]
      summary: Change username
      security: [{ accessCookie: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username: { type: string, minLength: 3, maxLength: 30, pattern: "^[A-Za-z0-9_]+$" }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }

  /change-password:
    patch:
      tags: [Account]
      summary: Change password (signs out every device)
      security: [{ accessCookie: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [oldPassword, newPassword]
              properties:
                oldPassword: { type: string, format: password }
                newPassword: { type: string, format: password, minLength: 8, maxLength: 72 }
      responses:
        "200":
          description: Password changed, cookies cleared - sign in again
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401":
          description: Not signed in, or the old password is wrong
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /deactivate-account:
    patch:
      tags: [Account]
      summary: Deactivate the account
      security: [{ accessCookie: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: Deactivated; cookies cleared
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /delete-account:
    delete:
      tags: [Account]
      summary: Permanently delete the account and all its data
      description: Removes the resume file, analysis, interviews, sessions, answers, reports and sessions. Needs the password.
      security: [{ accessCookie: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, format: password }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessResponse" }
        "401":
          description: Not signed in or wrong password
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /resume/upload:
    post:
      tags: [Resume]
      summary: Upload your resume (PDF, max 5 MB)
      description: One resume per user. The text is extracted once and stored. Scanned-image PDFs are rejected (422).
      security: [{ accessCookie: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [resume]
              properties:
                resume: { type: string, format: binary }
      responses:
        "201":
          description: Uploaded
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Resume" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413":
          description: File larger than 5 MB
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: No readable text in the PDF
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /resume:
    get:
      tags: [Resume]
      summary: Get your resume details
      security: [{ accessCookie: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: Resume (without the extracted text; `textLength` instead)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Resume" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Resume]
      summary: Replace your resume
      description: Deletes the old file and the old analysis - run the analysis again afterwards.
      security: [{ accessCookie: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [resume]
              properties:
                resume: { type: string, format: binary }
      responses:
        "200":
          description: Replaced
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Resume" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: No readable text in the PDF
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    delete:
      tags: [Resume]
      summary: Delete your resume and its analysis
      security: [{ accessCookie: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /resume/file:
    get:
      tags: [Resume]
      summary: Download / view your own resume PDF
      description: Streams the file (local storage) or redirects to it (Cloudinary). Only the owner can reach it.
      security: [{ accessCookie: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: The PDF
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "302":
          description: Redirect to the stored file (Cloudinary)
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /resume/analysis:
    post:
      tags: [Resume]
      summary: Analyse your resume with AI
      description: Takes 5-60 seconds with a real model. One analysis per user - re-running updates it.
      security: [{ accessCookie: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: Analysis
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ResumeAnalysis" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "502":
          description: The AI provider failed or returned unusable output
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: AI not configured (production without OPENROUTER_API_KEY)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    get:
      tags: [Resume]
      summary: Get the latest analysis
      security: [{ accessCookie: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: Analysis
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ResumeAnalysis" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /interview/generate:
    post:
      tags: [Interview]
      summary: Generate a mock interview (10 resume-based questions)
      description: Needs an uploaded and analysed resume. (`POST /generate` is a legacy alias.)
      security: [{ accessCookie: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateInterviewRequest" }
      responses:
        "201":
          description: Interview created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Interview" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The resume changed since the last analysis - analyse again
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "502":
          description: AI provider failure
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /interviews:
    get:
      tags: [Interview]
      summary: List your interviews
      description: Newest first, each with its latest session id/status, progress and score.
      security: [{ accessCookie: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: Interviews
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/InterviewListItem" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /interview/{interviewId}:
    parameters:
      - $ref: "#/components/parameters/InterviewId"
    get:
      tags: [Interview]
      summary: One interview with its latest session and report
      security: [{ accessCookie: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: Interview detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          interview: { $ref: "#/components/schemas/Interview" }
                          session: { allOf: [{ $ref: "#/components/schemas/Session" }], nullable: true }
                          report: { allOf: [{ $ref: "#/components/schemas/InterviewReport" }], nullable: true }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Interview]
      summary: Delete an interview with its sessions, answers and report
      security: [{ accessCookie: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /session/start:
    post:
      tags: [Interview]
      summary: Start (or resume) an interview session
      description: 'One active session per interview - calling again resumes it (200 with resumed: true).'
      security: [{ accessCookie: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [interviewId]
              properties:
                interviewId: { type: string, pattern: "^[a-f0-9]{24}$" }
      responses:
        "201":
          description: Started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionStartResponse" }
        "200":
          description: Resumed an existing session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionStartResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Interview already completed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /answer:
    post:
      tags: [Interview]
      summary: Submit the answer to the current question
      description: |
        The server decides which question is current. Send `questionIndex` (the question you are answering) so a double
        click or stale tab gets `409` instead of being stored against the next question.
        After the last answer the session completes and the AI report is generated in the same request.
        If the AI fails, the answers are kept and the response has `reportError`; fetch `GET /session/{id}/report` to retry.
      security: [{ accessCookie: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmitAnswerRequest" }
      responses:
        "200":
          description: 'Saved. `completed: false` returns the next question; `completed: true` returns the report.'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AnswerResult" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Question already answered, or the session is already completed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /session/{sessionId}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      tags: [Interview]
      summary: Session state (current question and progress)
      security: [{ accessCookie: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          session: { $ref: "#/components/schemas/Session" }
                          currentQuestion: { allOf: [{ $ref: "#/components/schemas/Question" }], nullable: true }
                          totalQuestions: { type: integer }
                          role: { type: string }
                          difficulty: { type: string, enum: [Easy, Medium, Hard] }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /session/{sessionId}/report:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      tags: [Interview]
      summary: Interview report for a finished session
      description: Generates it now if the earlier attempt failed. `409` until every question is answered.
      security: [{ accessCookie: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: Report
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/InterviewReport" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Session not finished yet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "502":
          description: AI provider failure (try again)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /performance/generate:
    post:
      tags: [Performance]
      summary: Generate the cumulative performance report
      description: Needs at least one finished interview. Reuses the existing report when nothing changed.
      security: [{ accessCookie: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: Report
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/PerformanceReport" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /performance:
    get:
      tags: [Performance]
      summary: Get the performance report
      security: [{ accessCookie: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: Report
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/PerformanceReport" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /performance/pdf:
    get:
      tags: [Performance]
      summary: Download the performance report as a PDF
      security: [{ accessCookie: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: PDF file
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /history:
    get:
      tags: [Performance]
      summary: Paginated interview history (one row per finished interview)
      security: [{ accessCookie: [] }, { bearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 10 } }
        - { name: search, in: query, description: Matches the role, schema: { type: string, maxLength: 100 } }
        - { name: difficulty, in: query, schema: { type: string, enum: [Easy, Medium, Hard] } }
        - { name: category, in: query, schema: { type: string, enum: [Technical, Behavioral, System Design, HR] } }
        - { name: sort, in: query, schema: { type: string, enum: [latest, oldest, highest-score, lowest-score], default: latest } }
      responses:
        "200":
          description: History page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/History" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /dashboard:
    get:
      tags: [Performance]
      summary: Everything the dashboard needs in one call
      description: Cached for 5 minutes, invalidated whenever your data changes.
      security: [{ accessCookie: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: Dashboard
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Dashboard" }
        "401": { $ref: "#/components/responses/Unauthorized" }

components:
  securitySchemes:
    accessCookie:
      type: apiKey
      in: cookie
      name: accessToken
      description: Set by `POST /login`.
    refreshCookie:
      type: apiKey
      in: cookie
      name: refreshToken
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    InterviewId:
      name: interviewId
      in: path
      required: true
      schema: { type: string, pattern: "^[a-f0-9]{24}$" }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string, pattern: "^[a-f0-9]{24}$" }

  responses:
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Unauthorized:
      description: Missing, invalid or expired access token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Conflict:
      description: Value already in use / state conflict
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

  schemas:
    Health:
      type: object
      properties:
        success: { type: boolean }
        status: { type: string, example: ok }
        cache: { type: string, enum: [redis, memory], description: Where cache and rate-limit counters live }
        uptime: { type: number, description: Seconds }
    SuccessResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        statusCode: { type: integer, example: 200 }
        message: { type: string }
        data: { nullable: true }
    ErrorResponse:
      type: object
      properties:
        success: { type: boolean, example: false }
        statusCode: { type: integer, example: 400 }
        message: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
    User:
      type: object
      properties:
        id: { type: string }
        username: { type: string }
        email: { type: string, format: email }
        isVerified: { type: boolean }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    SignupRequest:
      type: object
      required: [username, email, password]
      properties:
        username: { type: string, minLength: 3, maxLength: 30, pattern: "^[A-Za-z0-9_]+$", example: jane_dev }
        email: { type: string, format: email, example: jane@example.com }
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          description: Needs an uppercase letter, a lowercase letter, a number and a special character.
          example: Password@123
    OtpRequest:
      type: object
      required: [email, otp]
      properties:
        email: { type: string, format: email }
        otp: { type: string, pattern: "^\\d{6}$", example: "482913" }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
    ResetPasswordRequest:
      type: object
      required: [email, otp, newPassword]
      properties:
        email: { type: string, format: email }
        otp: { type: string, pattern: "^\\d{6}$" }
        newPassword: { type: string, format: password, minLength: 8, maxLength: 72 }
    Resume:
      type: object
      properties:
        _id: { type: string }
        userId: { type: string }
        fileName: { type: string }
        resumeUrl: { type: string }
        storage: { type: string, enum: [cloudinary, local] }
        textLength: { type: integer, description: Characters of extracted text }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ResumeAnalysis:
      type: object
      properties:
        _id: { type: string }
        resumeId: { type: string }
        summary: { type: string }
        technicalSkills: { type: array, items: { type: string } }
        softSkills: { type: array, items: { type: string } }
        strengths: { type: array, items: { type: string } }
        weaknesses: { type: array, items: { type: string } }
        missingSkills: { type: array, items: { type: string } }
        recommendedRoles: { type: array, items: { type: string } }
        improvementSuggestions: { type: array, items: { type: string } }
        atsScore: { type: integer, minimum: 0, maximum: 100 }
        updatedAt: { type: string, format: date-time }
    CreateInterviewRequest:
      type: object
      required: [role, experience]
      properties:
        role: { type: string, minLength: 2, maxLength: 100, example: Backend Developer }
        experience: { type: string, maxLength: 100, example: 2 years }
        difficulty: { type: string, enum: [Easy, Medium, Hard], default: Medium }
    Question:
      type: object
      properties:
        question: { type: string }
        category: { type: string, enum: [Technical, Behavioral, System Design, HR] }
    Interview:
      type: object
      properties:
        _id: { type: string }
        role: { type: string }
        experience: { type: string }
        difficulty: { type: string, enum: [Easy, Medium, Hard] }
        status: { type: string, enum: [CREATED, STARTED, COMPLETED] }
        questions:
          type: array
          items: { $ref: "#/components/schemas/Question" }
        createdAt: { type: string, format: date-time }
    InterviewListItem:
      type: object
      properties:
        id: { type: string }
        role: { type: string }
        experience: { type: string }
        difficulty: { type: string }
        status: { type: string, enum: [CREATED, STARTED, COMPLETED] }
        totalQuestions: { type: integer }
        createdAt: { type: string, format: date-time }
        sessionId: { type: string, nullable: true }
        sessionStatus: { type: string, enum: [STARTED, COMPLETED], nullable: true }
        answered: { type: integer }
        overallScore: { type: integer, nullable: true }
    Session:
      type: object
      properties:
        _id: { type: string }
        interviewId: { type: string }
        currentQuestionIndex: { type: integer }
        status: { type: string, enum: [STARTED, COMPLETED] }
    SessionStartResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessResponse"
        - type: object
          properties:
            data:
              type: object
              properties:
                session: { $ref: "#/components/schemas/Session" }
                currentQuestion: { allOf: [{ $ref: "#/components/schemas/Question" }], nullable: true }
                totalQuestions: { type: integer }
                resumed: { type: boolean }
    SubmitAnswerRequest:
      type: object
      required: [sessionId, answerText]
      properties:
        sessionId: { type: string, pattern: "^[a-f0-9]{24}$" }
        answerText: { type: string, minLength: 1, maxLength: 5000 }
        questionIndex: { type: integer, minimum: 0, description: The question you are answering (recommended) }
    AnswerResult:
      type: object
      properties:
        completed: { type: boolean }
        nextQuestion: { allOf: [{ $ref: "#/components/schemas/Question" }], description: Present when completed is false }
        report: { allOf: [{ $ref: "#/components/schemas/InterviewReport" }], nullable: true, description: Present when completed is true }
        reportError: { type: string, nullable: true, description: Set if the AI failed after the last answer }
        progress:
          type: object
          properties:
            answered: { type: integer }
            total: { type: integer }
    InterviewReport:
      type: object
      properties:
        _id: { type: string }
        sessionId: { type: string }
        interviewId: { type: string }
        overallScore: { type: integer }
        technicalScore: { type: integer }
        communicationScore: { type: integer }
        problemSolvingScore: { type: integer }
        confidenceScore: { type: integer }
        strengths: { type: array, items: { type: string } }
        weaknesses: { type: array, items: { type: string } }
        feedback: { type: string }
        recommendations: { type: array, items: { type: string } }
        interviewReadiness: { type: integer }
        createdAt: { type: string, format: date-time }
    PerformanceReport:
      type: object
      properties:
        overallProgress: { type: integer }
        technicalProgress: { type: integer }
        communicationProgress: { type: integer }
        problemSolvingProgress: { type: integer }
        confidenceProgress: { type: integer }
        strongestSkill: { type: string }
        weakestSkill: { type: string }
        improvementAreas: { type: array, items: { type: string } }
        studyPlan: { type: array, items: { type: string } }
        summary: { type: string }
        interviewReadiness: { type: integer }
        totalInterviews: { type: integer }
        updatedAt: { type: string, format: date-time }
    HistoryItem:
      type: object
      properties:
        reportId: { type: string }
        interviewId: { type: string }
        sessionId: { type: string }
        role: { type: string, nullable: true }
        experience: { type: string, nullable: true }
        difficulty: { type: string, nullable: true }
        overallScore: { type: integer }
        interviewReadiness: { type: integer }
        createdAt: { type: string, format: date-time }
    History:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/HistoryItem" }
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }
    Dashboard:
      type: object
      properties:
        dashboardStats:
          type: object
          properties:
            totalInterviews: { type: integer }
            averageScore: { type: integer }
            overallProgress: { type: integer }
            interviewReadiness: { type: integer }
        progressChart:
          nullable: true
          type: object
          properties:
            overallProgress: { type: integer }
            technicalProgress: { type: integer }
            communicationProgress: { type: integer }
            problemSolvingProgress: { type: integer }
            confidenceProgress: { type: integer }
        interviewHistory:
          type: array
          items:
            type: object
            properties:
              interviewId: { type: string }
              sessionId: { type: string }
              role: { type: string, nullable: true }
              difficulty: { type: string, nullable: true }
              overallScore: { type: integer }
              interviewReadiness: { type: integer }
              createdAt: { type: string, format: date-time }
        resumeAnalysis: { allOf: [{ $ref: "#/components/schemas/ResumeAnalysis" }], nullable: true }
        performanceReportOutdated: { type: boolean, description: True when interviews changed since the performance report was generated }
